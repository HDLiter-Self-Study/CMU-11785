# Data paths and loader runtime settings (non-search)
# @package data

# Paths are task-specific. Keep placeholders here; real values should come from task_configs.<task>.yaml
paths:
  train_dir: null      # e.g., "data/cls_data/train"
  val_dir: null        # e.g., "data/cls_data/dev"
  train_pairs: null    # optional, for verification pairing lists
  val_pairs: null      # optional, for verification pairing lists
  images_dir: null     # optional, common image root if pairs are used

image_settings:
  image_size: 112
  image_channels: 3

# Loader runtime settings (not searched). Can be overridden in task_configs.<task>.yaml
loader_settings:
  num_workers: 4
  pin_memory: true
