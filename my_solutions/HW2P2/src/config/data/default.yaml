# Data paths and loader runtime settings (non-search)
# @package data

# Paths are task-specific. Keep placeholders here; real values should come from task_configs.<task>.yaml
paths:
  # Common root for all data
  images_dir: "data"                     # Common root: data folder
  
  # Classification dataset paths (relative to images_dir)
  train_dir: "cls_data/train"            # Will become: data/cls_data/train
  val_dir: "cls_data/dev"                # Will become: data/cls_data/dev
  
  # Verification dataset paths (relative to images_dir)
  val_pairs_dir: "ver_data"              # Will become: data/ver_data
  val_pairs_txt: "val_pairs.txt"         # Will become: data/val_pairs.txt
  test_pairs_txt: "test_pairs.txt"       # Will become: data/test_pairs.txt
  
  # Optional: specific directories can override images_dir
  # train_pairs_dir: "ver_data/train"    # Will become: data/ver_data/train


# Loader runtime settings (not searched). Can be overridden in task_configs.<task>.yaml
loader_settings:
  num_workers: 4
  pin_memory: true
