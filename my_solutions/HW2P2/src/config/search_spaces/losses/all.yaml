# Loss Functions Search Space
# @package search_spaces.losses
# Classification and verification loss functions

# =============================================================================
# STRATEGY LEVELS REFERENCE
# =============================================================================
# Available strategy levels (set manually in strategy_level field):
# - basic: Standard loss functions, minimal complexity
# - robust: Balanced loss selection, recommended for most research  
# - comprehensive: Advanced loss functions, thorough exploration
# - custom: Maximum flexibility, all available loss functions

# =============================================================================
# LOSS FUNCTION STRATEGY
# =============================================================================
class: "strategy"
# Same-level dependency: ensure losses runs after architectures for naming 
# and after label_mixing to avoid using label_mixing in focal loss
depends_on: ["architectures", "label_mixing", "paradigm"]

# Meta-configuration: manually set by researcher (not searched)
strategy_level: "robust"  # ["basic", "robust", "comprehensive", "custom"]

# Policy: losses support sum/weighted_sum in addition to random_choice
policy:
  allowed_multi_modes: []
  require_selection_when_multi: true
  

# =============================================================================
# LOSSES FOR CLASSIFICATION PARADIGM
# =============================================================================
classification_paradigm_losses:
  class: "technique"
  condition: "$paradigm == 'classification'"
  
  # Loss function selection
  selection:
    class: "param"
    param_name: "classification_loss_type"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["cross_entropy_loss"]
      robust: ["cross_entropy_loss", "focal_loss"]
      comprehensive: ["cross_entropy_loss", "focal_loss"]
      custom: ["cross_entropy_loss", "focal_loss"]
    description: "Classification loss function selection"
  
  # Cross-entropy loss implementation
  cross_entropy_loss:
    class: "instance"
    condition: "$(classification_loss_type == 'cross_entropy_loss') or \
                (classification_loss_type == 'focal_loss' and label_mixing_technique != 'none')"
    # If label_mixing is used and focal loss is selected, fall back to cross-entropy loss
    label_smoothing:
      class: "param"  
      param_name: "cls_label_smoothing"
      type: "float"
      low: 0.0
      high: 0.3
      description: "Label smoothing factor"
      
    class_weights:
      class: "param"
      param_name: "cls_use_class_weights"
      type: "categorical"
      choices: [true, false]
      description: "Whether to use class weights"
  
  # Focal loss implementation
  focal_loss:
    class: "instance"
    condition: "$classification_loss_type == 'focal_loss' and label_mixing_technique == 'none'"
    
    alpha:
      class: "param"
      param_name: "cls_focal_alpha"
      type: "float"
      low: 0.1
      high: 1.0
      description: "Focal loss alpha parameter (class balance)"
      
    gamma:
      class: "param"
      param_name: "cls_focal_gamma"
      type: "float"
      low: 1.0
      high: 5.0
      description: "Focal loss gamma parameter (focusing parameter)"

# =============================================================================
# LOSSES FOR METRIC LEARNING PARADIGM
# =============================================================================
metric_learning_paradigm_losses:
  class: "technique"
  condition: "$paradigm == 'metric_learning'"
  
  # Loss function selection
  selection:
    class: "param"
    param_name: "metric_loss_type"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["contrastive_loss"]
      robust: ["contrastive_loss", "triplet_margin_with_distance_loss"]
      comprehensive: ["contrastive_loss", "triplet_margin_with_distance_loss"]
      custom: ["contrastive_loss", "triplet_margin_with_distance_loss"]
    description: "Metric learning loss function selection"
  
  # Contrastive loss implementation
  contrastive_loss:
    class: "instance"
    condition: "$metric_loss_type == 'contrastive_loss'"
    
    margin:
      class: "param"
      param_name: "metric_contrastive_margin"
      type: "float"
      low: "$0.1 if metric_contrastive_distance == 'cosine' or metric_contrastive_normalize else 0.5"
      high: "$1.0 if metric_contrastive_distance == 'cosine' or metric_contrastive_normalize else 5.0"
      description: "Triplet loss margin (cosine/normalized distance: 0.1-1.0, euclidean/manhattan: 0.5-5.0)"
      depends_on: ["metric_contrastive_distance", "metric_contrastive_normalize"]

    distance_metric:
      class: "param"
      param_name: "metric_contrastive_distance"
      type: "categorical"
      choices: ["euclidean", "cosine", "manhattan", "dot"]
      description: "Distance metric for triplet loss"

    normalize_embeddings:
      class: "param"
      param_name: "metric_contrastive_normalize"
      type: "categorical"
      choices: [true, false]
      description: "Whether to L2-normalize embeddings before distance calculation."

    squared_distance:
      class: "param"
      param_name: "metric_contrastive_squared"
      type: "categorical"
      choices: [true]
      description: "Whether to use squared Euclidean distance (valid only for euclidean metric)."
      condition: "$metric_contrastive_distance == 'euclidean'"
      depends_on: ["metric_contrastive_distance"]

    miner_type:
      class: "param"
      param_name: "metric_contrastive_miner_type"
      type: "categorical"
      choices: ["pair_margin", "batch_hard"]
      description: "Type of miner to use for contrastive loss"

    miner_margin_factor:
      class: "param"
      param_name: "metric_contrastive_miner_margin_factor"
      type: "float"
      low: 0.8
      high: 1.2
      description: "Margin factor for contrastive miner"
      condition: "$metric_contrastive_miner_type == 'pair_margin'"
      depends_on: ["metric_contrastive_miner_type"]
      
    pos_weight:
      class: "param"
      param_name: "metric_contrastive_pos_weight"
      type: "float"
      low: 0.5
      high: 2.0
      description: "Weight for positive pairs"

    neg_weight:
      class: "param"
      param_name: "metric_contrastive_neg_weight"
      type: "float"
      low: 0.5
      high: 2.0
      description: "Weight for negative pairs"

    avg_by:
      class: "param"
      param_name: "metric_contrastive_avg_by"
      type: "categorical"
      choices: ["global", "posneg"]
      description: "Averaging strategy to handle class imbalance."

    sampler_m:
      class: "param"
      param_name: "metric_contrastive_sampler_m"
      type: "categorical"
      choices: [4,8]
      description: "Number of samples per-class to draw from each batch"
  
  triplet_margin_with_distance_loss:
    class: "instance"
    condition: "$metric_loss_type == 'triplet_margin_with_distance_loss'"
    
    margin:
      class: "param"
      param_name: "metric_triplet_margin"
      type: "float"
      low: "$0.1 if metric_triplet_distance == 'cosine' or metric_triplet_normalize else 0.5"
      high: "$1.0 if metric_triplet_distance == 'cosine' or metric_triplet_normalize else 5.0"
      description: "Triplet loss margin (cosine/normalized distance: 0.1-1.0, euclidean/manhattan: 0.5-5.0)"
      depends_on: ["metric_triplet_distance", "metric_triplet_normalize"]

    distance_metric:
      class: "param"
      param_name: "metric_triplet_distance"
      type: "categorical"
      choices: ["euclidean", "cosine", "manhattan", "dot"]
      description: "Distance metric for triplet loss"

    normalize_embeddings:
      class: "param"
      param_name: "metric_triplet_normalize"
      type: "categorical"
      choices: [true, false]
      description: "Whether to L2-normalize embeddings before distance calculation."

    squared_distance:
      class: "param"
      param_name: "metric_triplet_squared"
      type: "categorical"
      choices: [true]
      description: "Whether to use squared Euclidean distance (valid only for euclidean metric)."
      condition: "$metric_triplet_distance == 'euclidean'"
      depends_on: ["metric_triplet_distance"]

    miner_type:
      class: "param"
      param_name: "metric_triplet_miner_type"
      type: "categorical"
      choices: ["triplet", "batch_hard"]
      description: "Type of miner to use for triplet loss"

    type_of_triplets:
      class: "param"
      param_name: "metric_triplet_type"
      type: "categorical"
      choices: ["semihard", "hard", "all"]
      description: "Type of triplets to use for triplet loss"
      condition: "$metric_triplet_miner_type == 'triplet'"
      depends_on: ["metric_triplet_miner_type"]

    miner_margin_factor:
      class: "param"
      param_name: "metric_triplet_miner_margin_factor"
      type: "float"
      low: 0.8
      high: 1.2
      description: "Margin factor for triplet miner"
      condition: "$metric_triplet_miner_type == 'triplet'"
      depends_on: ["metric_triplet_miner_type"]

    sampler_m:
      class: "param"
      param_name: "metric_triplet_sampler_m"
      type: "categorical"
      choices: [4,8]
      description: "Number of samples per-class to draw from each batch"
  
  center_loss:
    class: "instance"
    condition: "$metric_loss_type == 'center_loss'"
    
    distance_metric:
      class: "param"
      param_name: "metric_center_distance"
      type: "categorical"
      choices: ["euclidean", "cosine", "manhattan", "dot"]
      description: "Distance metric for center loss"

    normalize_embeddings:
      class: "param"
      param_name: "metric_center_normalize"
      type: "categorical"
      choices: [true, false]
      description: "Whether to L2-normalize embeddings before distance calculation."
    
    squared_distance:
      class: "param"
      param_name: "metric_center_squared"
      type: "categorical"
      choices: [true]
      description: "Whether to use squared Euclidean distance (valid only for euclidean metric)."
      condition: "$metric_center_distance == 'euclidean'"
      depends_on: ["metric_center_distance"]

    distance_scale:
      class: "param"
      param_name: "metric_center_distance_scale"
      type: "categorical"
      choices: [1, 5, 10, 20]
      description: "Scale for center loss distance"
      condition: "$metric_center_distance == 'cosine' or metric_center_normalize == true"
      depends_on: ["metric_center_distance", "metric_center_normalize"]

    