# Loss Functions Search Space
# @package search_spaces.losses
# Classification and verification loss functions

# =============================================================================
# STRATEGY LEVELS REFERENCE
# =============================================================================
# Available strategy levels (set manually in strategy_level field):
# - basic: Standard loss functions, minimal complexity
# - robust: Balanced loss selection, recommended for most research  
# - comprehensive: Advanced loss functions, thorough exploration
# - custom: Maximum flexibility, all available loss functions

# =============================================================================
# LOSS FUNCTION STRATEGY
# =============================================================================
class: "strategy"
# Same-level dependency: ensure losses runs after architectures for naming 
# and after label_mixing to avoid using label_mixing in focal loss
depends_on: ["architectures", "label_mixing"]

# Meta-configuration: manually set by researcher (not searched)
strategy_level: "robust"  # ["basic", "robust", "comprehensive", "custom"]

# Policy: losses support sum/weighted_sum in addition to random_choice
policy:
  allowed_multi_modes: []
  require_selection_when_multi: true
  

# =============================================================================
# CLASSIFICATION LOSS FUNCTIONS
# =============================================================================
classification_losses:
  class: "technique"
  condition: "$task == 'classification'"
  
  # Loss function selection
  selection:
    class: "param"
    param_name: "classification_loss_type"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["cross_entropy_loss"]
      robust: ["cross_entropy_loss", "focal_loss"]
      comprehensive: ["cross_entropy_loss", "focal_loss"]
      custom: ["cross_entropy_loss", "focal_loss"]
    description: "Classification loss function selection"
  
  # Cross-entropy loss implementation
  cross_entropy_loss:
    class: "instance"
    condition: "$(classification_loss_type == 'cross_entropy_loss') or \
                (classification_loss_type == 'focal_loss' and label_mixing_technique != 'none')"
    # If label_mixing is used and focal loss is selected, fall back to cross-entropy loss
    label_smoothing:
      class: "param"  
      param_name: "cls_label_smoothing"
      type: "float"
      low: 0.0
      high: 0.3
      description: "Label smoothing factor"
      
    class_weights:
      class: "param"
      param_name: "cls_use_class_weights"
      type: "categorical"
      choices: [true, false]
      description: "Whether to use class weights"
  
  # Focal loss implementation
  focal_loss:
    class: "instance"
    condition: "$classification_loss_type == 'focal_loss' and label_mixing_technique == 'none'"
    
    alpha:
      class: "param"
      param_name: "cls_focal_alpha"
      type: "float"
      low: 0.1
      high: 1.0
      description: "Focal loss alpha parameter (class balance)"
      
    gamma:
      class: "param"
      param_name: "cls_focal_gamma"
      type: "float"
      low: 1.0
      high: 5.0
      description: "Focal loss gamma parameter (focusing parameter)"

# =============================================================================
# VERIFICATION LOSS FUNCTIONS
# =============================================================================
verification_losses:
  class: "technique"
  condition: "$task in ['verification', 'verification_finetune']"
  
  # Loss function selection
  selection:
    class: "param"
    param_name: "verification_loss_type"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["contrastive_loss"]
      robust: ["contrastive_loss", "triplet_margin_with_distance_loss", "bce_with_logits_loss"]
      comprehensive: ["contrastive_loss", "triplet_margin_with_distance_loss", "arcface_loss", "bce_with_logits_loss"]
      custom: ["contrastive_loss", "triplet_margin_with_distance_loss", "arcface_loss", "bce_with_logits_loss"]
    description: "Verification loss function selection"
  
  # Contrastive loss implementation
  contrastive_loss:
    class: "instance"
    condition: "$verification_loss_type == 'contrastive_loss'"
    
    margin:
      class: "param"
      param_name: "ver_contrastive_margin"
      type: "float"
      low: 0.5
      high: 2.0
      description: "Contrastive loss margin"
      
    pos_weight:
      class: "param"
      param_name: "ver_contrastive_pos_weight"
      type: "float"
      low: 0.5
      high: 2.0
      description: "Weight for positive pairs"
  
  # Triplet loss implementation
  triplet_margin_with_distance_loss:
    class: "instance"
    condition: "$verification_loss_type == 'triplet_margin_with_distance_loss'"
    
    margin:
      class: "param"
      param_name: "ver_triplet_margin"
      type: "float"
      low: 0.1
      high: 1.0
      description: "Triplet loss margin"
      
    distance_metric:
      class: "param"
      param_name: "ver_triplet_distance"
      type: "categorical"
      choices: ["euclidean", "cosine", "manhattan"]
      description: "Distance metric for triplet loss"

    p:
      class: "param"
      param_name: "ver_triplet_p_norm"
      type: "categorical"
      choices: [1, 2]
      description: "The norm degree for p-norm distance. 1 for Manhattan, 2 for Euclidean."
  
  # ArcFace loss implementation
  arcface_loss:
    class: "instance"
    condition: "$verification_loss_type == 'arcface_loss'"
    
    scale:
      class: "param"
      param_name: "ver_arcface_scale"
      type: "float"
      low: 10.0
      high: 64.0
      description: "ArcFace scale parameter"
      
    margin:
      class: "param"
      param_name: "ver_arcface_margin"
      type: "float"
      low: 0.1
      high: 0.8 
      description: "ArcFace margin parameter"
  
  # Binary cross-entropy loss implementation
  bce_with_logits_loss:
    class: "instance"
    condition: "$verification_loss_type == 'bce_with_logits_loss'"
    
    pos_weight:
      class: "param"
      param_name: "ver_bce_pos_weight"
      type: "float"
      low: 0.5
      high: 2.0
      description: "Weight for positive class"
