# Architectures Default Configuration
# @package architectures

defaults:
  - resnet@resnet: main  # Default ResNet configuration
  - convnext@convnext: main  # ConvNeXt configuration (example of easy addition)
  - _self_

# =============================================================================
# STRATEGY LEVELS REFERENCE
# =============================================================================
# Available strategy levels (set manually in strategy_level field):
# - basic: Quick experiments, minimal search space
# - robust: Balanced exploration, recommended for most research  
# - comprehensive: Thorough search, larger parameter ranges
# - custom: Maximum flexibility, all available options

# =============================================================================
# ARCHITECTURE SELECTION STRATEGY
# =============================================================================

class: "strategy"

# Meta-configuration: manually set by researcher (not searched)
strategy_level: "robust"  # ["basic", "robust", "comprehensive", "custom"]

# Policy: required for unified grouped output parsing/validation
policy:
  allowed_multi_modes: []
  require_selection_when_multi: true
  # Here is actually a dummy policy, because architectures is processed alone, without using the pipeline resolver.
  # But we still need to define it, to keep the validation simple (no hard-coded whitelist)

# Architecture selection technique (actual hyperparameter search)
# architecture_type is exported globally with no prefix so that other strategies
# can use it for prefixed naming and conditions.
architecture_selection:
  class: "technique"
  
  selection:
    class: "param"
    param_name: "architecture_type"
    type: "categorical"
    arch_irrelevant: true
    export_to_global: true
    dependency_order: ["strategy_level"]
    choices:
      basic: ["resnet"]  
      robust: ["resnet", "convnext"]  
      comprehensive: ["resnet", "convnext"]  
      custom: ["resnet", "convnext"]
    description: "Architecture type selection"

# Stage number selection
# num_stages is exported globally with no prefix for stage expansions and lists.
num_stages_selection:
  class: "technique"

  selection:
    class: "param"
    param_name: "num_stages"
    type: "categorical"
    arch_irrelevant: true
    export_to_global: true
    dependency_order: ["strategy_level"]
    choices:
      basic: [4]  
      robust: [3, 4] 
      comprehensive: [3, 4, 5] 
      custom: [3, 4, 5]
    description: "Number of stages for architecture"

# =============================================================================
# ARCHITECTURE-AWARE ACTIVATION & NORMALIZATION PARAMETERS (UNIFIED INSTANCE)
# =============================================================================

# Activation configuration (architecture-aware) - unified instance with instance-level granularity
activation_params:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection", "block_type_params"]

  selection:
    class: "param"
    param_name: "activation_granularity"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["global"]
      robust: ["global", "block_type"]
      comprehensive: ["global", "block_type", "stage"]
      custom: ["global", "block_type", "stage", "block_stage"]
    description: "Granularity level for activation function control"

  activation:
    class: "instance"
    granularity: "$activation_granularity"

    activation:
      class: "param"
      param_name: "activation"
      type: "categorical"
      dependency_order: ["architecture_type"]
      choices:
        resnet: ["relu", "gelu", "swish", "leaky_relu", "elu", "mish"]
        convnext: ["gelu", "relu", "swish", "silu", "leaky_relu", "elu", "mish"]
      description: "Activation function with unified granularity"

# Normalization configuration (architecture-aware) - unified instance with instance-level granularity
normalization_params:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection", "block_type_params"]

  selection:
    class: "param"
    param_name: "norm_granularity"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["global"]
      robust: ["global", "block_type"]
      comprehensive: ["global", "block_type", "stage"]
      custom: ["global", "block_type", "stage", "block_stage"]
    description: "Granularity level for normalization method control"

  normalization:
    class: "instance"
    granularity: "$norm_granularity"

    normalization:
      class: "param"
      param_name: "normalization"
      type: "categorical"
      dependency_order: ["architecture_type"]
      choices:
        resnet: ["batch_norm", "group_norm", "layer_norm"]
        convnext: ["layer_norm", "batch_norm", "group_norm"]
      description: "Normalization method with unified granularity"

    num_groups:
      class: "param"
      param_name: "num_groups"
      type: "categorical"
      choices: [4,8,16,32]
      condition: "$normalization == 'group_norm'"
      description: "Number of groups for GroupNorm (active only when normalization == group_norm)"
      depends_on: ["normalization"]

# =============================================================================
# BLOCK TYPE CONFIGURATION (ARCHITECTURE-AWARE WITH GRANULARITY)
# =============================================================================
block_type_params:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection"]

  selection:
    class: "param"
    param_name: "block_type_granularity"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["global"]
      robust: ["global", "stage"]
      comprehensive: ["global", "stage"]
      custom: ["global", "stage"]
    description: "Granularity level for block type control"

  block_type:
    class: "instance"
    granularity: "$block_type_granularity"

    block_type:
      class: "param"
      param_name: "block_type"
      type: "categorical"
      dependency_order: ["architecture_type"]
      choices:
        resnet: ["basic", "bottleneck"]
        convnext: ["inverted_bottleneck"]
      description: "Block type with unified granularity (global or stage)"

# =============================================================================
# ARCHITECTURE SHAPE SELECTION (unified width + regnet params)
# =============================================================================
shape_search:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection"]

  selection:
    class: "param"
    param_name: "arch_shape"
    type: "categorical"
    arch_irrelevant: true
    export_to_global: true
    dependency_order: ["strategy_level"]
    choices:
      basic: ["balanced"]
      robust: ["balanced", "wide_shallow", "narrow_deep"]
      comprehensive: ["balanced", "wide_shallow", "narrow_deep"]
      custom: ["balanced", "wide_shallow", "narrow_deep"]
    description: "Shape family driving width & RegNet parameter ranges"


  # RegNet-based depth generation (architecture-aware parameters)
  # See <https://arxiv.org/abs/2101.00590> for details
  # The number of stages is sampled in upper level because it is needed by other parameters
  regnet_rule:
    class: "instance"

    width_slope:
      class: "param"
      param_name: "regnet_width_slope"
      type: "float"
      dependency_order: ["num_stages", "arch_shape"]
      low:
        3:
          balanced: 1.8
          wide_shallow: 1.8
          narrow_deep: 1.9
        4:
          balanced: 1.4
          wide_shallow: 1.6
          narrow_deep: 1.6
        5:
          balanced: 1.3
          wide_shallow: 1.4
          narrow_deep: 1.5
      high:
        3:
          balanced: 2.1
          wide_shallow: 2.2
          narrow_deep: 2.3
        4:
          balanced: 1.8
          wide_shallow: 1.8
          narrow_deep: 2.0
        5:
          balanced: 1.6
          wide_shallow: 1.6
          narrow_deep: 1.9

    initial_width:
      class: "param"
      param_name: "regnet_initial_width"
      type: "categorical"
      # Constrain initial width by num_stages and shape to curb wide_shallow extremes (ns=4)
      dependency_order: ["num_stages", "arch_shape"]
      choices:
        3:
          balanced: [48, 64]
          wide_shallow: [48, 64]
          narrow_deep: [48, 64]
        4:
          balanced: [32, 48]
          wide_shallow: [32]
          narrow_deep: [32]
        5:
          balanced: [32]
          wide_shallow: [32]
          narrow_deep: [32, 48]

    # Width multiplier with stage-specific dynamic ranges to prevent extreme combinations
    # This ensures the product (initial_width × width_multiplier) stays within reasonable bounds
    # Using int type with dynamic low/high for Optuna compatibility
    width_multiplier:
      class: "param"
      param_name: "regnet_width_multiplier"
      type: "int"
      dependency_order: ["num_stages", "arch_shape"]
      depends_on: ["regnet_initial_width"]
      auto_fix_range: true
      # Stage- & shape-specific ranges: tighter control for higher num_stages to keep models ≤18M
      # Logic: as num_stages increases, both low and high should decrease to control model size
      # Keep ranges consistent with target width ceilings per shape, auto_fix_range works as a safety net only
      low:
        3:
          wide_shallow: "$max(1, ceil(120 / regnet_initial_width))"
          balanced: "$max(1, ceil(96 / regnet_initial_width))"
          narrow_deep: "$max(1, ceil(64 / regnet_initial_width))"
        4:
          wide_shallow: "$max(1, ceil(112 / regnet_initial_width))"
          balanced: "$max(1, ceil(80 / regnet_initial_width))"
          narrow_deep: "$max(1, ceil(48 / regnet_initial_width))"
        5:
          wide_shallow: "$max(1, ceil(104 / regnet_initial_width))"     
          balanced: "$max(1, ceil(64 / regnet_initial_width))"         
          narrow_deep: "$max(1, ceil(32 / regnet_initial_width))"     
      high:
        3:
          wide_shallow: "$min(3, floor(136 / regnet_initial_width))"
          balanced: "$min(4, floor(136 / regnet_initial_width))"
          narrow_deep: "$min(3, floor(128 / regnet_initial_width))"
        4:
          wide_shallow: "$min(3, floor(152 / regnet_initial_width))"
          balanced: "$min(2, floor(120 / regnet_initial_width))"
          narrow_deep: "$min(2, floor(72 / regnet_initial_width))"
        5:
          wide_shallow: "$min(2, floor(120 / regnet_initial_width))"
          balanced: "$min(3, floor(112 / regnet_initial_width))"
          narrow_deep: "$min(2, floor(56 / regnet_initial_width))"

    # Optional stage width cap to guard extreme tails without shrinking earlier stages.
    # When present, StagePlanner will clamp each stage width: width_i = min(width_i, max_stage_width)
    # Keep this conservative and only enable for risky combinations, e.g. wide_shallow x ns=3.
    max_stage_width:
      class: "param"
      param_name: "regnet_max_stage_width"
      type: "categorical"
      dependency_order: ["num_stages", "arch_shape"]
      # Provide values for all combinations to satisfy dependency resolution.
      # Use a large cap (e.g., 1024) for combos that should effectively never trigger the clamp.
      choices:
        3:
          wide_shallow: [640, 704]
          balanced: [1024]
          narrow_deep: [1024]
        4:
          wide_shallow: [1024]
          balanced: [1024]
          narrow_deep: [1024]
        5:
          wide_shallow: [1024]
          balanced: [1024]
          narrow_deep: [1024]

    depth_slope:
      class: "param"
      param_name: "regnet_depth_slope"
      type: "float"
      dependency_order: ["arch_shape"]
      low:
        balanced: 0.40
        wide_shallow: 0.20
        narrow_deep: 0.55
      high:
        balanced: 0.60
        wide_shallow: 0.35
        narrow_deep: 0.80

    depth_bias:
      class: "param"
      param_name: "regnet_depth_bias"
      type: "float"
      dependency_order: ["arch_shape"]
      low:
        balanced: 2.5
        wide_shallow: 2.2
        narrow_deep: 2.6
      high:
        balanced: 3.2
        wide_shallow: 2.8
        narrow_deep: 3.6

    # Stage depth limits
    min_stage_depth:
      class: "param"
      param_name: "regnet_min_stage_depth"
      type: "categorical"
      choices: [2]

    max_stage_depth:
      class: "param"
      param_name: "regnet_max_stage_depth"
      type: "categorical"
      # Further tighten deeper tails for wide_shallow at ns=4; slightly tighten balanced at ns=5
      dependency_order: ["arch_shape", "num_stages"]
      choices:
        balanced:
          3: [8, 10]
          4: [6, 8]
          5: [6, 7]
        wide_shallow:
          3: [5, 6]
          4: [4, 5]
          5: [4, 5]
        narrow_deep:
          3: [8, 10]
          4: [7, 8]
          5: [8, 10]


  
# SE (Squeeze-and-Excitation) module configuration - shared by all architectures
se_params:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection"]
  
  selection:
    class: "param"
    param_name: "se_selection"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["disabled"]
      robust: ["disabled", "enabled"]
      comprehensive: ["disabled", "enabled"]
      custom: ["disabled", "enabled"]
    description: "Enable/disable Squeeze-and-Excitation modules in blocks"
    
  se_pooling:
    class: "instance"
    condition: "$se_selection == 'enabled'"
    skip_instance_layer: true  # Skip intance level when creating hierachy dict for better format

    se_pooling:
      class: "param"
      param_name: "se_pooling"
      type: "categorical"
      depends_on: ["se_selection"]  # Depends on SE selection
      choices: ["avg", "max", "skew", "var"]
      description: "Pooling method for SE module squeeze step (ECANet style with Conv1D)"
      condition: "$se_selection == 'enabled'"

# Layer scale technique - shared by all architectures
layer_scale:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection"]
  
  selection:
    class: "param"
    param_name: "layer_scale_selection"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["disabled"]
      robust: ["disabled", "enabled"]
      comprehensive: ["disabled", "enabled"]
      custom: ["disabled", "enabled"]
    description: "Enable/disable layer scale for training stability"

  layer_scale_instance:
    class: "instance"
    condition: "$layer_scale_selection == 'enabled'"
    skip_instance_layer: true  # Skip intance level when creating hierachy dict for better format

    layer_scale_init_value:
      class: "param"
      param_name: "layer_scale_init_value"
      type: "float"
      low: 1e-6
      high: 1e-4
      log: true
      description: "Initial value for layer scale parameters"
      condition: "$layer_scale_selection == 'enabled'"

# Stochastic depth technique - shared by all architectures
stochastic_depth:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection"]
  
  selection:
    class: "param"
    param_name: "stochastic_depth_selection"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["disabled"]
      robust: ["disabled", "enabled"]
      comprehensive: ["disabled", "enabled"]
      custom: ["disabled", "enabled"]
    description: "Enable/disable stochastic depth (DropPath)"
    
  stochastic_depth_prob:
    class: "instance"
    condition: "$stochastic_depth_selection == 'enabled'"
    skip_instance_layer: true  # Skip intance level when creating hierachy dict for better format

    stochastic_depth_prob:
      class: "param"
      param_name: "stochastic_depth_prob"
      type: "float"
      low: 0.0
      high: 0.5
      description: "Stochastic depth (DropPath) probability"

# Conv dropout technique - shared by all architectures
conv_dropout:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection"]
  
  selection:
    class: "param"
    param_name: "conv_dropout_selection"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["disabled"]
      robust: ["disabled", "enabled"]
      comprehensive: ["disabled", "enabled"]  
      custom: ["disabled", "enabled"]
    description: "Enable/disable dropout between conv layers"
    
  conv_drop_prob:
    class: "instance"
    condition: "$conv_dropout_selection == 'enabled'"
    skip_instance_layer: true  # Skip intance level when creating hierachy dict for better format

    conv_drop_prob:
      class: "param"
      param_name: "conv_drop_prob"
      type: "float"
      low: 0.0
      high: 0.5
      description: "Dropout probability between conv layers"
      condition: "$conv_dropout_selection == 'enabled'"

# Projection type for shortcut connections - always enabled, just method selection
projection_params:
  class: "technique"
  depends_on: ["architecture_selection", "num_stages_selection"]
  
  projection_type:
    class: "instance"
    skip_instance_layer: true  # 跳过instance层，直接在technique下创建参数

    projection_type:
      class: "param"
      param_name: "projection_type"
      type: "categorical"
      choices: ["conv", "avg_pool", "max_pool"]
      description: "Shortcut projection method when dimensions mismatch"


