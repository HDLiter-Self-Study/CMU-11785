# Optimizer Strategy Search Space
# @package search_spaces.optimizer

class: "strategy"
depends_on: ["architectures"]

# Default level; can be overridden via strategy_levels
strategy_level: "robust"  # [basic, robust, comprehensive, custom]

# Policy: unified grouped output validation
policy:
  allowed_multi_modes: []
  require_selection_when_multi: true
  required: true

optimizer_techniques:
  class: "technique"

  selection:
    class: "param"
    param_name: "optimizer_strategy"
    type: "categorical"
    choices:
      basic: ["adam", "sgd"]
      robust: ["adam", "sgd", "adamw", "rmsprop"]
      comprehensive: ["adam", "sgd", "adamw", "rmsprop"]
      custom: ["adam", "sgd", "adamw", "rmsprop"]
    description: "Optimizer selection"
    dependency_order: ["strategy_level"]

  adam:
    class: "instance"
    condition: "$optimizer_strategy in ['adam']"

    lr:
      class: "param"
      param_name: "adam_learning_rate"
      type: "float"
      low: 1e-6
      high: 1e-1
      log: true

    weight_decay:
      class: "param"
      param_name: "adam_weight_decay"
      type: "float"
      low: 1e-7
      high: 1e-2
      log: true

    eps:
      class: "param"
      param_name: "adam_eps"
      type: "float"
      low: 1e-10
      high: 1e-6
      log: true

    amsgrad:
      class: "param"
      param_name: "adam_amsgrad"
      type: "categorical"
      choices: [true, false]

    beta1:
      class: "param"
      param_name: "adam_beta1"
      type: "float"
      low: 0.8
      high: 0.95

    beta2:
      class: "param"
      param_name: "adam_beta2"
      type: "float"
      low: 0.98
      high: 0.999

  sgd:
    class: "instance"
    condition: "$optimizer_strategy in ['sgd']"

    lr:
      class: "param"
      param_name: "sgd_learning_rate"
      type: "float"
      low: 1e-4
      high: 5e-1
      log: true

    weight_decay:
      class: "param"
      param_name: "sgd_weight_decay"
      type: "float"
      low: 1e-7
      high: 1e-2
      log: true

    momentum:
      class: "param"
      param_name: "sgd_momentum"
      type: "float"
      low: 0.0
      high: 0.99

    nesterov:
      class: "param"
      param_name: "sgd_nesterov"
      type: "categorical"
      choices: [true, false]
      condition: "$sgd_momentum > 0.0"
      depends_on: ["sgd_momentum"]

    dampening:
      class: "param"
      param_name: "sgd_dampening"
      type: "float"
      low: 0.0
      high: 0.1
      condition: "$sgd_momentum > 0.0 and sgd_nesterov == False"
      depends_on: ["sgd_momentum", "sgd_nesterov"]

  adamw:
    class: "instance"
    condition: "$optimizer_strategy in ['adamw']"

    lr:
      class: "param"
      param_name: "adamw_learning_rate"
      type: "float"
      low: 1e-6
      high: 1e-1
      log: true

    weight_decay:
      class: "param"
      param_name: "adamw_weight_decay"
      type: "float"
      low: 1e-6
      high: 5e-1
      log: true

    eps:
      class: "param"
      param_name: "adamw_eps"
      type: "float"
      low: 1e-10
      high: 1e-6
      log: true

    amsgrad:
      class: "param"
      param_name: "adamw_amsgrad"
      type: "categorical"
      choices: [true, false]

    beta1:
      class: "param"
      param_name: "adamw_beta1"
      type: "float"
      low: 0.8
      high: 0.95

    beta2:
      class: "param"
      param_name: "adamw_beta2"
      type: "float"
      low: 0.98
      high: 0.999

  rmsprop:
    class: "instance"
    condition: "$optimizer_strategy in ['rmsprop']"

    lr:
      class: "param"
      param_name: "rmsprop_learning_rate"
      type: "float"
      low: 1e-6
      high: 1e-2
      log: true

    alpha:
      class: "param"
      param_name: "rmsprop_alpha"
      type: "float"
      low: 0.9
      high: 0.99

    eps:
      class: "param"
      param_name: "rmsprop_eps"
      type: "float"
      low: 1e-10
      high: 1e-7
      log: true

    weight_decay:
      class: "param"
      param_name: "rmsprop_weight_decay"
      type: "float"
      low: 1e-6
      high: 1e-2
      log: true

    momentum:
      class: "param"
      param_name: "rmsprop_momentum"
      type: "float"
      low: 0.0
      high: 0.99

    centered:
      class: "param"
      param_name: "rmsprop_centered"
      type: "categorical"
      choices: [true, false]


