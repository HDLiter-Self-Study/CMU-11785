# Evaluators Search Space
# @package search_spaces.evaluators
# Defines how model outputs (embeddings, logits) are converted to final predictions.

class: "strategy"
depends_on: ["architectures", "paradigm"] # Depends on output shapes from architecture
strategy_level: "robust"

policy:
  allowed_multi_modes: []
  require_selection_when_multi: true

# =============================================================================
# EVALUATORS FOR CLASSIFICATION PARADIGM
# =============================================================================
classification_paradigm_evaluators:
  class: "technique"
  condition: "$paradigm == 'classification'"
  
  # For classification, the evaluator is fixed to argmax.
  selection:
    class: "param"
    param_name: "classification_evaluator_type"
    type: "categorical"
    choices: ["argmax"]
    description: "Evaluator for classification tasks."

  argmax:
    class: "instance"
    condition: "$classification_evaluator_type == 'argmax'"
    # Argmax has no configurable parameters.
    # This serves as a placeholder to formalize the evaluation step.
    
# =============================================================================
# EVALUATORS FOR METRIC LEARNING PARADIGM
# =============================================================================
metric_learning_paradigm_evaluators:
  class: "technique"
  condition: "$paradigm == 'metric_learning'"

  selection:
    class: "param"
    param_name: "metric_evaluator_type"
    type: "categorical"
    choices: ["cosine_similarity"]
    description: "Evaluator for metric learning tasks (how to compare embeddings)."

  cosine_similarity:
    class: "instance"
    condition: "$metric_evaluator_type == 'cosine_similarity'"
    # Cosine similarity is a parameter-free calculation, but we can configure
    # preprocessing steps on the embeddings it receives.
    use_l2_norm:
      class: "param"
      param_name: "metric_eval_use_l2_norm"
      type: "categorical"
      choices: [true, false]
      description: "Whether to L2 normalize embeddings before calculating cosine similarity."
    
    temperature:
      class: "param"
      param_name: "metric_eval_temperature"
      type: "float"
      low: 0.01
      high: 1.0
      description: "Temperature scaling for similarity scores."


