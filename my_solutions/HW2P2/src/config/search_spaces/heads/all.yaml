# Heads Search Space (Classification and Verification)
# @package search_spaces.heads

# Unified heads strategy with task-conditional techniques.

class: "strategy"
depends_on: ["architectures"]
strategy_level: "robust"

# Policy: unified grouped output validation
policy:
  allowed_multi_modes: []
  require_selection_when_multi: true
  

# Classification heads (active only for classification tasks)
classification_heads:
  class: "technique"
  condition: "$task == 'classification'"

  selection:
    class: "param"
    param_name: "classification_head_type"
    type: "categorical"
    dependency_order: ["strategy_level"]
    choices:
      basic: ["standard"]
      robust: ["standard", "dropout_head"]
      comprehensive: ["standard", "dropout_head"]
      custom: ["standard", "dropout_head"]
    description: "Classification head architecture selection"

  standard:
    class: "instance"
    condition: "$classification_head_type == 'standard'"
    pooling_type:
      class: "param"
      param_name: "cls_standard_pooling_type"
      type: "categorical"
      choices: ["avg", "max", "adaptive_avg", "adaptive_max","none"]
    # Single-layer bottleneck for ClassificationHead
    head_hidden_dims:
      class: "param"
      param_name: "head_hidden_dims"
      type: "categorical"
      # null means direct Linear(C_last -> num_classes)
      choices: [null, 256, 384, 512]
      description: "Hidden dimension for ClassificationHead bottleneck (None for direct)"
    # Optional search knobs for a future enhanced head; kept but decoupled from hidden dims
    activation:
      class: "param"
      param_name: "cls_standard_activation"
      type: "categorical"
      choices: ["relu", "gelu", "swish", "leaky_relu"]
    use_batch_norm:
      class: "param"
      param_name: "cls_standard_use_batch_norm"
      type: "categorical"
      choices: [true, false]

  dropout_head:
    class: "instance"
    condition: "$classification_head_type == 'dropout_head'"
    pooling_type:
      class: "param"
      param_name: "cls_dropout_pooling_type"
      type: "categorical"
      choices: ["avg", "max", "adaptive_avg", "adaptive_max","none"]
    hidden_dims:
      class: "param"
      param_name: "cls_dropout_hidden_dims"
      type: "categorical"
      choices: [[512], [1024], [512, 256], [1024, 512], [2048, 1024]]
    activation:
      class: "param"
      param_name: "cls_dropout_activation"
      type: "categorical"
      choices: ["relu", "gelu", "swish", "leaky_relu"]
    use_batch_norm:
      class: "param"
      param_name: "cls_dropout_use_batch_norm"
      type: "categorical"
      choices: [true, false]
    dropout_rate:
      class: "param"
      param_name: "cls_dropout_dropout_rate"
      type: "float"
      low: 0.1
      high: 0.8
    dropout_schedule:
      class: "param"
      param_name: "cls_dropout_dropout_schedule"
      type: "categorical"
      choices: ["constant", "linear_decay", "cosine_decay"]


