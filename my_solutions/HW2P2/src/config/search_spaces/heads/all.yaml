# Heads Search Space (Classification and Verification)
# @package search_spaces.heads

# Unified heads strategy with task-conditional techniques.

class: "strategy"
# Ensure heads are processed after architectures to get correct in_features
depends_on: ["architectures", "paradigm"]
strategy_level: "robust"

# Policy: unified grouped output validation
policy:
  allowed_multi_modes: []
  require_selection_when_multi: true

# =============================================================================
# CLASSIFICATION HEAD
# =============================================================================
classification_heads:
  class: "technique"
  condition: "$paradigm == 'classification'"

  # With a unified ClassificationHead, there is only one instance.
  # All configurable aspects are defined as searchable parameters below.
  classification_head:
    class: "instance"
    
    # -------------------------------------------------------------------------
    # --- Part 1: Feature Processor ---
    # -------------------------------------------------------------------------
    pooling_type:
      class: "param"
      param_name: "head_pooling_type"
      type: "categorical"
      choices: ["adaptive_avg", "adaptive_max"]
      description: "Type of adaptive pooling to apply to backbone features."

    hidden_dims:
      class: "param"
      param_name: "head_hidden_dims"
      type: "categorical"
      choices:
        - "null"        # Direct connection: in_features -> num_classes
        - "[256]"
        - "[512]"
        - "[512, 256]"
        - "[1024, 512]"
      description: "List of hidden layer dimensions for the MLP head. Null means no hidden layers."

    activation:
      class: "param"
      param_name: "head_activation"
      type: "categorical"
      choices: ["relu", "gelu", "swish"]
      condition: "$head_hidden_dims != 'null'"
      description: "Activation function for hidden layers."

    use_batch_norm:
      class: "param"
      param_name: "head_use_batch_norm"
      type: "categorical"
      choices: [true, false]
      condition: "$head_hidden_dims != 'null'"
      description: "Whether to use BatchNorm in hidden layers."

    dropout_rate:
      class: "param"
      param_name: "head_dropout_rate"
      type: "float"
      low: 0.0
      high: 0.5
      condition: "$head_hidden_dims != 'null'"
      description: "Dropout rate for hidden layers."

    # -------------------------------------------------------------------------
    # --- Part 2: Classifier Component Selection ---
    # -------------------------------------------------------------------------
    classifier_type:
      class: "param"
      param_name: "head_classifier_type"
      type: "categorical"
      choices: ["linear", "arc_face", "cos_face", "sphere_face"]
      description: "The final classifier layer type."

    # -------------------------------------------------------------------------
    # --- Part 3: Classifier-Specific Parameters ---
    # -------------------------------------------------------------------------
    # Parameters for ArcFace, sampled only when classifier_type is 'arcface'.
    arcface_scale:
      class: "param"
      param_name: "head_arcface_scale"
      type: "float"
      low: 30.0
      high: 64.0
      depends_on: ["head_classifier_type"]
      condition: "$head_classifier_type == 'arcface'"
      description: "Scale parameter (s) for ArcFace."

    arcface_margin:
      class: "param"
      param_name: "head_arcface_margin"
      type: "float"
      low: 0.3
      high: 0.7
      step: 0.05
      depends_on: ["head_classifier_type"]
      condition: "$head_classifier_type == 'arcface'"
      description: "Margin parameter (m) for ArcFace."
      
    # Parameters for CosFace
    cosface_scale:
      class: "param"
      param_name: "head_cosface_scale"
      type: "float"
      low: 30.0
      high: 64.0
      depends_on: ["head_classifier_type"]
      condition: "$head_classifier_type == 'cosface'"
      description: "Scale parameter (s) for CosFace."

    cosface_margin:
      class: "param"
      param_name: "head_cosface_margin"
      type: "float"
      low: 0.2
      high: 0.5
      step: 0.05
      depends_on: ["head_classifier_type"]
      condition: "$head_classifier_type == 'cosface'"
      description: "Margin parameter (m) for CosFace."

    # Parameters for SphereFace
    sphereface_scale:
      class: "param"
      param_name: "head_sphereface_scale"
      type: "float"
      low: 30.0
      high: 64.0
      depends_on: ["head_classifier_type"]
      condition: "$head_classifier_type == 'sphereface'"
      description: "Scale parameter (s) for SphereFace."

    sphereface_margin:
      class: "param"
      param_name: "head_sphereface_margin"
      type: "int"
      low: 2
      high: 5
      depends_on: ["head_classifier_type"]
      condition: "$head_classifier_type == 'sphereface'"
      description: "Margin parameter (m) for SphereFace. Must be an integer."


