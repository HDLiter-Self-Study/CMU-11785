# Scheduler Strategy Search Space
# @package search_spaces.scheduler

class: "strategy"
depends_on: ["optimizer"]

strategy_level: "robust"

# Policy: unified grouped output validation
policy:
  allowed_multi_modes: []
  require_selection_when_multi: true
  required: false

lr_scheduler_techniques:
  class: "technique"

  selection:
    class: "param"
    param_name: "lr_scheduler_strategy"
    type: "categorical"
    choices:
      basic: ["reduce_lr_on_plateau"]
      robust: ["reduce_lr_on_plateau", "step_lr"]
      comprehensive: ["cosine_annealing_lr", "step_lr", "reduce_lr_on_plateau"]
      custom: ["cosine_annealing_lr", "step_lr", "reduce_lr_on_plateau"]
    dependency_order: ["strategy_level"]

  cosine_annealing_lr:
    class: "instance"
    condition: "$lr_scheduler_strategy in ['cosine_annealing_lr']"

    T_max:
      class: "param"
      param_name: "cosine_T_max"
      type: "int"
      low: 5
      high: 100

    eta_min_ratio:
      class: "param"
      param_name: "cosine_eta_min_ratio"
      type: "float"
      low: 0.001
      high: 0.1
      log: true

  step_lr:
    class: "instance"
    condition: "$lr_scheduler_strategy in ['step_lr']"

    step_size:
      class: "param"
      param_name: "step_size"
      type: "int"
      low: 20
      high: 40

    gamma:
      class: "param"
      param_name: "step_gamma"
      type: "float"
      low: 0.3
      high: 0.7

  reduce_lr_on_plateau:
    class: "instance"
    condition: "$lr_scheduler_strategy in ['reduce_lr_on_plateau']"

    patience:
      class: "param"
      param_name: "plateau_patience"
      type: "int"
      low: 5
      high: 20

    factor:
      class: "param"
      param_name: "plateau_factor"
      type: "float"
      low: 0.1
      high: 0.8

    threshold:
      class: "param"
      param_name: "plateau_threshold"
      type: "float"
      low: 1e-5
      high: 1e-2
      log: true

    threshold_mode:
      class: "param"
      param_name: "plateau_threshold_mode"
      type: "categorical"
      choices: ["rel", "abs"]

    cooldown:
      class: "param"
      param_name: "plateau_cooldown"
      type: "int"
      low: 0
      high: 10

    min_lr:
      class: "param"
      param_name: "plateau_min_lr"
      type: "float"
      low: 1e-8
      high: 1e-4
      log: true

    eps:
      class: "param"
      param_name: "plateau_eps"
      type: "float"
      low: 1e-9
      high: 1e-6
      log: true


